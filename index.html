<!-- ===================== BRANDING + CORPORATE DARK LAYER v2 =====================
     Pegar UNA sola vez, justo antes de </body>. Para cambiar el logo, edita BRAND más abajo
     (acepta URL, SVG o PNG en base64). -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#0B0F19; --surface:rgba(255,255,255,.035); --line:rgba(255,255,255,.10);
  --emerald:#10b981; --emerald-hi:#34d399; --cobalt:#2563eb; --cobalt-hi:#60a5fa; --gold:#fbbf24; --coral:#fb923c;
  --ink:#f1f5f9; --ink2:#a8b3c7; --ink3:#7b879c;
  --ui:'Plus Jakarta Sans',Inter,-apple-system,system-ui,sans-serif; --num:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
html,html body[class]{background:var(--bg)}
html body[class]{font-family:var(--ui);color:var(--ink);letter-spacing:-.006em}
html body button,html body input,html body select{font-family:var(--ui)}
html body .font-mono{font-family:var(--ui);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1}
html body h1,html body h2,html body h3{letter-spacing:-.025em}
html body .text-slate-400{color:var(--ink2)} html body .text-slate-500{color:var(--ink3)}
html body .text-emerald-400,html body .text-emerald-300{color:var(--emerald-hi)}
html body .text-blue-300,html body .text-blue-400{color:var(--cobalt-hi)}
html body::before{opacity:.5;background:radial-gradient(620px 420px at 12% 6%,rgba(16,185,129,.13),transparent 62%),radial-gradient(560px 440px at 88% 14%,rgba(37,99,235,.15),transparent 62%),radial-gradient(640px 500px at 50% 105%,rgba(37,99,235,.08),transparent 62%)}

/* ---------- Superficies glass ---------- */
html body main .rounded-2xl.backdrop-blur-xl[class*="bg-slate-900/"]{
  background:linear-gradient(150deg,rgba(255,255,255,.065),rgba(255,255,255,.02) 55%),rgba(15,21,34,.72);
  border:1px solid var(--line);border-radius:18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -28px rgba(0,0,0,.9),0 2px 6px rgba(0,0,0,.35)}
html body main .rounded-2xl[class*="bg-gradient-to-br"]{
  background-image:linear-gradient(150deg,rgba(16,185,129,.20),rgba(11,15,25,.55) 70%)!important;border:1px solid rgba(16,185,129,.35)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 48px -26px rgba(16,185,129,.35)}
html body header[class*="bg-slate-900/"]{background:rgba(11,15,25,.78);border-color:var(--line);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
html body #employee-modal>div,html body #receipt-modal>div{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),rgba(14,19,32,.9);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 50px 90px -30px rgba(0,0,0,.95)}
html body #login-view{background:radial-gradient(ellipse at 50% -10%,rgba(37,99,235,.18),transparent 60%),var(--bg)}
html body #login-view [class*="backdrop-blur-2xl"]{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),rgba(14,19,32,.82);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 40px 90px -30px rgba(37,99,235,.35)}
html body [class*="border-slate-800"]{border-color:var(--line)}
html body #splash{background:var(--bg)}

/* ---------- Marca ---------- */
.app-icon.has-logo,.splash-logo.has-logo{background:none!important;box-shadow:none!important;border-radius:0!important;animation-name:none}
.splash-logo.has-logo{animation:splashPop .8s cubic-bezier(.34,1.56,.64,1) both}
.brand-img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 14px rgba(16,185,129,.35))}
header .app-icon.has-logo{width:42px;height:42px}
#login-view .app-icon.has-logo{width:92px;height:92px;margin-bottom:.75rem}
.splash-logo.has-logo{width:112px;height:112px}
header .brand-split{width:1px;height:26px;background:var(--line);margin:0 2px}
.brand-footer{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 16px;color:var(--ink3);font-size:12px}
.brand-footer .bf-rule{height:1px;width:36px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18))}
.brand-footer .bf-rule:last-child{transform:scaleX(-1)}
.brand-footer b{font-weight:700;letter-spacing:-.01em;background:linear-gradient(90deg,var(--emerald-hi),var(--cobalt-hi));-webkit-background-clip:text;background-clip:text;color:transparent}
#app-view .brand-footer{border-top:1px solid var(--line);margin-top:8px}
#login-view .brand-footer{margin:18px -8px -10px;padding-bottom:6px}
@media (max-width:767px){#app-view .brand-footer{margin-bottom:calc(76px + env(safe-area-inset-bottom,0px))}}

/* ---------- Botones: cobalto = acción, esmeralda = confirmar ---------- */
html body button.from-emerald-500,html body button.bg-blue-600{background-image:linear-gradient(135deg,#3b82f6,#1d4ed8)!important;background-color:var(--cobalt);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 24px -10px rgba(37,99,235,.7)}
html body button.from-emerald-500:hover,html body button.bg-blue-600:hover{background-image:linear-gradient(135deg,#60a5fa,#2563eb)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 14px 30px -10px rgba(37,99,235,.85)}
html body button.bg-emerald-500{background-color:var(--emerald);background-image:linear-gradient(180deg,#34d399,#10b981)!important;color:#03231a;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 24px -12px rgba(16,185,129,.75)}
html body button.bg-emerald-500:hover{background-color:#34d399;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 14px 30px -12px rgba(16,185,129,.9)}
html body button.bg-emerald-500\/15,html body button.bg-blue-500\/20{background:rgba(16,185,129,.12);color:var(--emerald-hi);border:1px solid rgba(16,185,129,.3)}
html body input:focus,html body select:focus{border-color:#3b82f6!important;box-shadow:0 0 0 3px rgba(59,130,246,.25)!important}
html body input[type=checkbox]{accent-color:var(--emerald)}
html body #tab-pill{background:linear-gradient(135deg,rgba(37,99,235,.32),rgba(16,185,129,.2));border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 18px -8px rgba(37,99,235,.7),inset 0 1px 0 rgba(255,255,255,.12)}
html body #main-tabs .tab-btn.tab-active{color:#fff}
@media (max-width:767px){html body #main-tabs .tab-btn.tab-active{color:var(--cobalt-hi)}}

/* ---------- Nocturnidad (ámbar) y extras (coral) ---------- */
#kpi-night-bonus,#kpi-night-hours{color:var(--gold)!important}
#kpi-night-hours{opacity:.8}
.group .w-8.h-8.bg-blue-500\/15{background:linear-gradient(180deg,#fcd34d,#d97706)}
#kpi-overtime-bonus,#kpi-overtime-hours{color:var(--coral)!important}
#kpi-overtime-hours{opacity:.8}
.group .w-8.h-8.bg-amber-500\/15{background:linear-gradient(180deg,#fdba74,#ea580c)}
.group .w-8.h-8.bg-emerald-500\/20{background:linear-gradient(180deg,#34d399,#059669)}
#shifts-table-body td:nth-child(4),#schedule-table-body td:nth-child(4),#team-detail-body td:nth-child(4){color:var(--gold)!important}
#shifts-table-body td:nth-child(5),#team-detail-body td:nth-child(5){color:var(--coral)!important}
html body #assigned-shift-name{background:rgba(251,191,36,.12);color:var(--gold);border-color:rgba(251,191,36,.3)}
#shift-live-preview{background:rgba(16,185,129,.07);border-color:rgba(16,185,129,.25)}

/* ---------- Tablas y desglose tipo nómina ---------- */
html body thead tr{background:rgba(255,255,255,.035)}
html body thead th{font-size:11.5px;font-weight:600;color:var(--ink2);letter-spacing:.01em;padding-top:.8rem;padding-bottom:.8rem}
html body tbody td{font-variant-numeric:tabular-nums}
html body td.font-mono,html body td.text-right{font-family:var(--num);font-size:12.5px}
@media (min-width:768px){
  html body tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
  html body tbody tr:hover{background:rgba(59,130,246,.07)}
}
html body #payments-table-body td:nth-child(6){font-weight:700;color:var(--emerald-hi);font-size:13.5px}
#salary-breakdown-list{border:1px solid var(--line);border-radius:14px;padding:6px 16px 16px;background:rgba(0,0,0,.18)}
#salary-breakdown-list::before{content:"Concepto";display:block;padding:10px 0 8px;margin:0 0 4px;font-size:11.5px;font-weight:600;color:var(--ink3);border-bottom:1px solid var(--line)}
#salary-breakdown-list>div{border-bottom:1px dashed rgba(255,255,255,.09)!important}
#salary-breakdown-list>div .font-mono{font-family:var(--num);font-size:13.5px}
#salary-breakdown-list>div:last-child{margin-top:12px;padding:14px 16px!important;border:1px solid rgba(16,185,129,.35)!important;border-radius:12px;background:linear-gradient(90deg,rgba(16,185,129,.18),rgba(16,185,129,.04))}
#salary-breakdown-list>div:last-child .font-mono{font-size:1.35rem}
html body #kpi-net-total{color:var(--emerald-hi);text-shadow:0 0 28px rgba(16,185,129,.35)}

/* ---------- Recibo de haberes ---------- */
.rcp-brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 14px;margin-bottom:16px;border-bottom:2px solid var(--emerald)}
.rcp-brand img{height:46px;width:auto}
.rcp-brand .rcp-meta{text-align:right;font-size:11px;color:var(--ink2);line-height:1.5}
.rcp-brand .rcp-meta strong{display:block;font-size:13px;color:#fff;letter-spacing:-.01em}
.payslip .font-mono,.payslip .rcp-meta span{font-family:var(--num)}
.payslip .space-y-2\.5>div{padding-bottom:8px;border-bottom:1px dotted rgba(255,255,255,.12)}
.payslip .space-y-2\.5>div:last-child{border-bottom:0}
.payslip>div.flex.items-start{border-bottom:0!important;padding-bottom:0!important;margin-bottom:12px!important}
.payslip>div.flex.items-center.justify-between.bg-emerald-950\/40{border-radius:12px;background:linear-gradient(90deg,rgba(16,185,129,.2),rgba(16,185,129,.05))}
@media print{
  .rcp-brand{border-bottom-color:#047857}
  #receipt-modal-content *{color:#0f172a!important;background:transparent!important;border-color:#cbd5e1!important;text-shadow:none!important}
  #receipt-modal-content .rcp-meta strong{color:#0f172a!important}
  .brand-footer{display:none!important}
}
</style>

(() => {
  const $ = id => document.getElementById(id);
  const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const logoImg = () => { const i = mk('img', 'brand-img'); i.src = BRAND.logo; i.alt = BRAND.name; i.decoding = 'async'; return i; };

  /* Favicon, icono de iPhone y color de barra */
  document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach(l => l.remove());
  [['icon', BRAND.favicon, 'image/png'], ['apple-touch-icon', BRAND.appleIcon, 'image/png']].forEach(([rel, href, type]) => {
    const l = mk('link'); l.rel = rel; l.type = type; l.href = href; document.head.appendChild(l);
  });
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = '#0B0F19';

  /* Logo en header, login y pantalla de carga */
  document.querySelectorAll('.app-icon,.splash-logo').forEach(el => {
    el.classList.add('has-logo'); el.textContent = ''; el.appendChild(logoImg());
  });
  const brandText = document.querySelector('header .font-bold.text-base');
  if (brandText) brandText.textContent = BRAND.name;

  /* Firma / marca de agua minimalista */
  const footer = () => mk('div', 'brand-footer',
    `<span class="bf-rule"></span><span>Powered by <b>${BRAND.poweredBy}</b> · v${typeof APP_VERSION !== 'undefined' ? APP_VERSION : ''}</span><span class="bf-rule"></span>`);
  const app = $('app-view'), card = document.querySelector('#login-view > div.relative.z-10');
  if (app) app.appendChild(footer());
  if (card) card.appendChild(footer());

  /* Recibo con membrete corporativo */
  const rc = $('receipt-modal-content');
  if (rc) new MutationObserver(() => {
    if (rc.querySelector('.rcp-brand')) return;
    if (!/Comprobante Oficial/.test(rc.textContent)) { rc.classList.remove('payslip'); return; }
    rc.classList.add('payslip');
    const h = mk('div', 'rcp-brand',
      `<img src="${BRAND.logo}" alt="${BRAND.name}"><div class="rcp-meta"><strong>Recibo de haberes</strong><span>Emitido el ${new Date().toLocaleDateString('es-PY')}</span></div>`);
    rc.insertBefore(h, rc.firstChild);
  }).observe(rc, { childList: true });
})();
</script>
